name: Android UI compile gate

on:
  push:
    branches:
      - chatgpt/stitch-ui-integration
  workflow_dispatch:

concurrency:
  group: android-ui-compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-debug-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
